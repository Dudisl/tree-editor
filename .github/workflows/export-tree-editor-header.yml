name: Export Tree Editor Header

on:
  push:
    branches:
      - tree-components

permissions:
  contents: write

jobs:
  export-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tree-components
      - name: Export TreeEditorHeader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/client/TreeEditorComponents.tsx')
          text = path.read_text()
          old = 'function TreeEditorHeader() {'
          new = 'export function TreeEditorHeader() {'
          if new not in text:
              if old not in text:
                  raise SystemExit('TreeEditorHeader declaration not found')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/TreeEditorComponents.tsx
          git commit -m "Export TreeEditorHeader component"
          git push origin HEAD:tree-components
